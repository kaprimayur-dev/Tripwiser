name: Production Railway Data Ingestion

'on':
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run mode (no database writes)'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-railway-import
  cancel-in-progress: false

jobs:
  ingest:
    name: Ingest Verified Railway Dataset
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Preflight Safety Checks (Database, PostGIS, Tables & Migrations)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          PYTHONPATH: backend
        run: |
          python -c "
          import asyncio
          from app.core.db import check_database_health, engine
          from sqlalchemy import text

          async def preflight():
              print('=====================================================')
              print(' [TripWiser] Production Preflight Database Validation')
              print('=====================================================')
              
              # 1. Connectivity check
              healthy = await check_database_health()
              if not healthy:
                  raise SystemExit('FATAL: Database connectivity check failed. Aborting.')
              print('[OK] Database connectivity verified via check_database_health().')

              async with engine.connect() as conn:
                  # 2. Database identity and PostGIS availability
                  db_info = await conn.execute(text('SELECT current_database(), current_user;'))
                  db_name, db_user = db_info.fetchone()
                  print(f'[OK] Target Database: {db_name} (Role: {db_user})')

                  pgis = await conn.execute(text('SELECT postgis_version();'))
                  postgis_ver = pgis.scalar()
                  if not postgis_ver:
                      raise SystemExit('FATAL: PostGIS extension is not installed or enabled!')
                  print(f'[OK] PostGIS Version: {postgis_ver}')

                  # 3. Alembic migration revision verification
                  rev = await conn.execute(text('SELECT version_num FROM alembic_version;'))
                  current_rev = rev.scalar()
                  expected_rev = '003_expand_train_number_length'
                  if current_rev != expected_rev:
                      raise SystemExit(f'FATAL: Alembic revision is {current_rev}, expected {expected_rev}. Aborting.')
                  print(f'[OK] Alembic revision matches head: {current_rev}')

                  # 4. Required tables check
                  tables_res = await conn.execute(text(\"\"\"
                      SELECT table_name FROM information_schema.tables 
                      WHERE table_schema = 'public' 
                        AND table_name IN ('stations', 'trains', 'train_schedules', 'alembic_version');
                  \"\"\"))
                  found_tables = set(r[0] for r in tables_res.fetchall())
                  required_tables = {'stations', 'trains', 'train_schedules', 'alembic_version'}
                  missing = required_tables - found_tables
                  if missing:
                      raise SystemExit(f'FATAL: Missing required database tables: {missing}. Aborting.')
                  print(f'[OK] Required tables present: {sorted(list(found_tables))}')

                  # 5. Baseline record counts
                  st_cnt = (await conn.execute(text('SELECT count(*) FROM stations;'))).scalar()
                  tr_cnt = (await conn.execute(text('SELECT count(*) FROM trains;'))).scalar()
                  sc_cnt = (await conn.execute(text('SELECT count(*) FROM train_schedules;'))).scalar()
                  print(f'[INFO] Existing Stations:        {st_cnt}')
                  print(f'[INFO] Existing Trains:          {tr_cnt}')
                  print(f'[INFO] Existing Schedule Stops:  {sc_cnt}')
                  print('=====================================================')

          asyncio.run(preflight())
          "

      - name: Execute Railway Dataset Ingestion (DRY-RUN)
        if: ${{ inputs.dry_run == true }}
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          PYTHONPATH: backend
        run: |
          echo "Executing railway dataset ingestion in DRY-RUN mode (zero database writes)..."
          python -m app.cli.import_railway_data --source datameet --dry-run

      - name: Execute Railway Dataset Ingestion (PERSISTENCE)
        if: ${{ inputs.dry_run == false }}
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          PYTHONPATH: backend
        run: |
          echo "Executing railway dataset ingestion in PERSISTENCE mode against production database..."
          python -m app.cli.import_railway_data --source datameet --persist-all

      - name: Post-Persistence Database Verification
        if: ${{ inputs.dry_run == false }}
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          PYTHONPATH: backend
        run: |
          python -c "
          import asyncio
          from app.core.db import engine
          from sqlalchemy import text

          async def post_verify():
              print('=====================================================')
              print(' [TripWiser] Post-Persistence Production Verification')
              print('=====================================================')
              async with engine.connect() as conn:
                  st = (await conn.execute(text('SELECT count(*) FROM stations;'))).scalar()
                  st_geo = (await conn.execute(text('SELECT count(*) FROM stations WHERE location IS NOT NULL;'))).scalar()
                  tr = (await conn.execute(text('SELECT count(*) FROM trains;'))).scalar()
                  sc = (await conn.execute(text('SELECT count(*) FROM train_schedules;'))).scalar()

                  print(f'Stations:        {st} (expected: 8697)')
                  print(f'Geolocated:      {st_geo} (expected: 8697)')
                  print(f'Trains:          {tr} (expected: 164)')
                  print(f'Schedule Stops:  {sc} (expected: 23602)')

                  errors = []
                  if st != 8697: errors.append(f'Station count mismatch: {st} != 8697')
                  if st_geo != 8697: errors.append(f'Geolocated station mismatch: {st_geo} != 8697')
                  if tr != 164: errors.append(f'Train count mismatch: {tr} != 164')
                  if sc != 23602: errors.append(f'Schedule stops mismatch: {sc} != 23602')

                  if errors:
                      for e in errors:
                          print(f'::error::{e}')
                      raise SystemExit('FATAL: Production record count verification failed!')
                  print('[SUCCESS] All production database records verified exactly.')
                  print('=====================================================')

          asyncio.run(post_verify())
          "
