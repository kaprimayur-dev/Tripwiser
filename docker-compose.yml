version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: tripwiser-postgres
    environment:
      POSTGRES_DB: tripwiser_db
      POSTGRES_USER: tripwiser
      POSTGRES_PASSWORD: tripwiser
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripwiser -d tripwiser_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tripwiser-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tripwiser-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://tripwiser:tripwiser@postgres:5432/tripwiser_db
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
      - AVAILABILITY_PROVIDER=mock
      - CHART_VACANCY_PROVIDER=mock
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tripwiser-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
